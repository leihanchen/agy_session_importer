  <!-- Source CLI session window (left) -->
  <rect x="28" y="34" width="38" height="44" rx="6" fill="#1E293B" stroke="#94A3B8" stroke-width="3" />
  <path d="M35 46 L42 52 L35 58" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="45" y1="58" x2="58" y2="58" stroke="#E2E8F0" stroke-width="3.2" stroke-linecap="round" />
  <line x1="35" y1="68" x2="56" y2="68" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
  <!-- Target Antigravity conversation card (right) -->
  <rect x="64" y="48" width="36" height="46" rx="7" fill="#1D4ED8" stroke="#E0F2FE" stroke-width="3" />
  <line x1="72" y1="62" x2="92" y2="62" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
